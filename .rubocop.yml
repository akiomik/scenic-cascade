plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - gemfiles/*.gemfile

Style/StringLiterals:
  Enabled: true

Style/StringLiteralsInInterpolation:
  Enabled: true

Layout/LineLength:
  Max: 120

RSpec/SpecFilePathFormat:
  Exclude:
    - spec/generators/**/*.rb

RSpec/MultipleMemoizedHelpers:
  Max: 6

# The finder examples intentionally share their caller's lets and hooks.
RSpec/IncludeExamples:
  Exclude:
    - spec/scenic/cascade/dependency_finder_spec.rb
    - spec/scenic/cascade/dependent_finder_spec.rb

# Generator specs load migration classes from generated files and remove them after each example.
RSpec/RemoveConst:
  Exclude:
    - spec/generators/scenic/view/cascade/cascade_generator_spec.rb
