# Download sources
sources:
  - name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

gems:
  # Skip loading rbs gem's RBS.
  # It's unnecessary if you don't use rbs as a library.
  - name: rbs
    ignore: true
  # Racc is not used directly, and its current signatures require a newer RBS parser.
  - name: racc
    ignore: true
  # The CGI gem's signatures depend on StringIO signatures absent from RBS 3.3.2.
  # CGI is not used by this library directly.
  - name: cgi
    ignore: true
