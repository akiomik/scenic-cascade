name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  lint_workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Install actionlint
      run: |
        curl --fail --location --silent --show-error \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$RUNNER_TEMP/actionlint.tar.gz"
        printf '%s  %s\n' \
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
          "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
    - name: Lint workflows
      run: '"$RUNNER_TEMP/actionlint"'

  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'

    services:
      postgres:
        image: postgres:14-alpine
        ports:
          - '5432:5432'
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run bin/setup
      run: bin/setup
    - name: Check RBS collection lock
      if: matrix.ruby == '3.4'
      run: |
        bundle exec rbs collection update
        bundle exec rbs collection install
        git diff --exit-code -- rbs_collection.lock.yaml
    - name: Run the default task
      run: bundle exec rake
      env:
        POSTGRES_HOST: localhost
        POSTGRES_DB: testdb
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
    - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        files: ./coverage/coverage.xml
        flags: unittests
