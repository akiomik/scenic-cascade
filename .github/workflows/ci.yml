name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  lint_workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install actionlint
      run: |
        curl --fail --location --silent --show-error \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$RUNNER_TEMP/actionlint.tar.gz"
        printf '%s  %s\n' \
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
          "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
    - name: Lint workflows
      run: '"$RUNNER_TEMP/actionlint"'

  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.scenic && format('Ruby {0} / Rails {1} / Scenic {2}', matrix.ruby, matrix.rails, matrix.scenic) || matrix.gemfile == 'Gemfile' && format('Ruby {0}', matrix.ruby) || format('Ruby {0} / Rails {1}', matrix.ruby, matrix.rails) }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.1', rails: '7.1', gemfile: 'gemfiles/rails_7_1.gemfile' }
          - { ruby: '3.1', rails: '7.2', gemfile: 'Gemfile' }
          - { ruby: '3.2', rails: '7.2', gemfile: 'Gemfile' }
          - { ruby: '3.3', rails: '7.2', gemfile: 'Gemfile' }
          - { ruby: '3.4', rails: '7.2', gemfile: 'Gemfile' }
          - { ruby: '3.2', rails: '8.0', gemfile: 'gemfiles/rails_8_0.gemfile' }
          - { ruby: '3.4', rails: '8.0', gemfile: 'gemfiles/rails_8_0.gemfile' }
          - { ruby: '3.2', rails: '8.1', gemfile: 'gemfiles/rails_8_1.gemfile' }
          - { ruby: '3.4', rails: '8.1', gemfile: 'gemfiles/rails_8_1.gemfile' }
          - { ruby: '3.4', rails: '7.2', scenic: '1.8', gemfile: 'gemfiles/scenic_1_8.gemfile' }

    services:
      postgres:
        image: postgres:14-alpine
        ports:
          - '5432:5432'
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.335.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run bin/setup
      if: matrix.gemfile == 'Gemfile'
      run: bin/setup
    - name: Check RBS collection lock
      if: matrix.ruby == '3.4' && matrix.gemfile == 'Gemfile'
      run: |
        bundle exec rbs collection update
        bundle exec rbs collection install
        git diff --exit-code -- rbs_collection.lock.yaml
    - name: Run the default task
      if: matrix.gemfile == 'Gemfile'
      run: bundle exec rake
      env:
        POSTGRES_HOST: localhost
        POSTGRES_DB: testdb
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
    - name: Run compatibility specs
      if: matrix.gemfile != 'Gemfile'
      run: bundle exec rspec
      env:
        POSTGRES_HOST: localhost
        POSTGRES_DB: testdb
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
    - uses: codecov/codecov-action@v7.1.1
      with:
        use_oidc: true
        fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        files: ./coverage/coverage.xml
        flags: unittests
