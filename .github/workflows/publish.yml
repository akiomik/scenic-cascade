name: Publish gem
on:
  release:
    types: [released]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      ruby_version: ${{ steps.ruby_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.335.0
        with:
          bundler: none
      - id: version
        name: Validate release tag and gem version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash bin/release-version
      - id: ruby_version
        run: printf 'version=%s\n' "$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.335.0
        with:
          bundler: none
      - run: gem build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gem
          path: scenic-cascade-${{ needs.validate.outputs.version }}.gem
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gem
      - uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: ${{ needs.validate.outputs.ruby_version }}
          bundler: none
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - env:
          GEM_VERSION: ${{ needs.validate.outputs.version }}
        run: gem push "scenic-cascade-${GEM_VERSION}.gem"
